# STAGE 4 — Test. Evals run when the agent's instructions change.
#
# The trigger is the point: editing CLAUDE.md, a skill or a hook changes how the system
# behaves just as surely as editing src/. Without this, a trimmed CLAUDE.md degrades output
# for weeks before anyone connects the two.
#
# Setup: add ANTHROPIC_API_KEY to repository secrets.
name: Claude evals

on:
  push:
    paths:
      - 'CLAUDE.md'
      - '.claude/**'
      - 'evals/**'
  pull_request:
    paths:
      - 'CLAUDE.md'
      - '.claude/**'
      - 'evals/**'
  schedule:
    - cron: '0 3 * * *' # nightly — catches drift from model and dependency updates
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # run-evals.sh gives each task its own worktree

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Set up project
        run: make install

      - name: Run evals
        id: evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          ./evals/run-evals.sh 2>&1 | tee eval-output.txt

      - name: Report on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const out = fs.readFileSync('eval-output.txt', 'utf8').slice(-60000);
            const ok = '${{ steps.evals.outcome }}' === 'success';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Evals: ${ok ? 'pass' : 'FAIL'}\n\n`
                  + '```\n' + out + '\n```\n\n'
                  + (ok ? '' : 'A drop in pass rate after an instruction change is a '
                            + 'regression. Fix or revert before merging.'),
            });
